# API keys are intentionally blank. Prefer environment variables in production.
providers:
  virustotal:
    api_key: ""
    base_url: "https://www.virustotal.com/api/v3"
    requests_per_minute: 4
  abuseipdb:
    api_key: ""
    base_url: "https://api.abuseipdb.com/api/v2"
