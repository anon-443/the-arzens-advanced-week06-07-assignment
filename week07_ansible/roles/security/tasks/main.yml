---
- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, auditd, audispd-plugins]
    state: present
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh
- name: Set UFW default deny incoming
  community.general.ufw: direction=incoming policy=deny
- name: Set UFW default allow outgoing
  community.general.ufw: direction=outgoing policy=allow
- name: Allow approved TCP ports
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: '{{ security_allowed_ports }}'
- name: Enable UFW
  community.general.ufw: state=enabled
- name: Enable fail2ban and auditd
  ansible.builtin.service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: [fail2ban, auditd]
